---
# Inventory production. Connection params come from encrypted vault vars.
# Do not put real IP/SSH/user/key values here.
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    vps_targets:
      vars:
        ansible_host: "{{ lookup('ansible.builtin.pipe', inventory_dir ~ '/../scripts/vault-get.sh --host ' ~ inventory_hostname ~ ' ssh_host') }}"
        ansible_user: "{{ lookup('ansible.builtin.pipe', inventory_dir ~ '/../scripts/vault-get.sh --host ' ~ inventory_hostname ~ ' ssh_user') }}"
        ansible_port: "{{ lookup('ansible.builtin.pipe', inventory_dir ~ '/../scripts/vault-get.sh --host ' ~ inventory_hostname ~ ' ssh_port') | default(22, true) }}"
        ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.pipe', inventory_dir ~ '/../scripts/vault-get.sh --host ' ~ inventory_hostname ~ ' ssh_key') | default('~/.ssh/id_rsa', true) }}"
      children:
        vps:
          hosts:
            vps-hetzner-prod:
              vps_display_name: maxtg-router-openclaw-cx23
              expected_app_dirs:
                - /opt/maxtg-bridge
                - /opt/openclaw
                - /opt/lightrag
                - /opt/fluentloop-bot
              disabled_containers:
                - openclaw-openclaw-gateway-1
              expected_host_files:
                - path: /etc/ssh/sshd_config.d/51-channel-m-reverse.conf
                  owner: router_configuration
                  purpose: Channel M deploy-user scoped GatewayPorts policy
                - path: /usr/local/sbin/channel-m-reverse-firewall.sh
                  owner: router_configuration
                  purpose: Channel M docker bridge firewall persistence
                - path: /usr/local/sbin/channel-m-reverse-listener-watchdog.sh
                  owner: router_configuration
                  purpose: Channel M stale reverse listener recovery
                - path: /etc/systemd/system/channel-m-reverse-firewall.service
                  owner: router_configuration
                  purpose: Channel M docker bridge firewall systemd unit
                - path: /etc/systemd/system/channel-m-reverse-firewall.timer
                  owner: router_configuration
                  purpose: Channel M docker bridge firewall timer
                - path: /etc/systemd/system/channel-m-reverse-listener-watchdog.service
                  owner: router_configuration
                  purpose: Channel M stale listener watchdog unit
                - path: /etc/systemd/system/channel-m-reverse-listener-watchdog.timer
                  owner: router_configuration
                  purpose: Channel M stale listener watchdog timer
              expected_systemd_timers:
                - name: vps-monitor.timer
                  owner: vps_management
                - name: vps-external-watchdog.timer
                  owner: vps_management
                - name: channel-m-reverse-firewall.timer
                  owner: router_configuration
                - name: channel-m-reverse-listener-watchdog.timer
                  owner: router_configuration
              restricted_tcp_listeners:
                - port: 18057
                  name: channel-m-reverse
                  owner: router_configuration / maxtg_bridge
                  expected_scope: docker_bridge
            vps-hostkey-hermes:
              vps_display_name: hermes-ai-office-host
              expected_app_dirs:
                - /opt/stealth
                - /opt/moex-futoi
                - /opt/cheap-intelligence
                - /opt/reddit-compass
                - /opt/benka-hermes
              host_backup_paths:
                - /var/lib/docker/volumes/cheap-intelligence_digest_data/_data
                - /var/lib/docker/volumes/cheap-intelligence_digest_postgres/_data
                # Application-owned secrets and durable state. restic encrypts
                # these inputs; this repository never reads or edits them.
                - /opt/benka-hermes/state
                - /opt/benka-hermes/private
              expected_containers:
                - name: caddy
                  owner: router_configuration
                  healthcheck: docker
                - name: xray
                  owner: router_configuration
                  healthcheck: docker
                - name: moex-futoi-bot-1
                  owner: moex_futoi
                  healthcheck: docker
                - name: ci-digest
                  owner: AiNativeBook_Draft_26/services/digest-service
                  healthcheck: docker
                - name: ci-digest-postgres
                  owner: AiNativeBook_Draft_26/services/digest-service
                  healthcheck: docker
                - name: ci-caddy-inner
                  owner: AiNativeBook_Draft_26/services/digest-service
                  healthcheck: docker
                - name: rc-api
                  owner: reddit_compass
                  healthcheck: docker
                - name: rc-caddy
                  owner: reddit_compass
                  healthcheck: docker
                - name: ladder
                  owner: reddit_compass
                  healthcheck: docker
                - name: benka-hermes-caddy-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-gateway-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-dashboard-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-redis-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-wiki-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-lightrag-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-omniroute-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-worker-email-personal-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-worker-email-work-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-worker-telegram-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-worker-signals-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-worker-last30days-1
                  owner: my-ai-office
                  healthcheck: docker
                - name: benka-hermes-worker-maintenance-1
                  owner: my-ai-office
                  healthcheck: docker
              expected_systemd_timers:
                - name: vps-monitor.timer
                  owner: vps_management
                - name: vps-external-watchdog.timer
                  owner: vps_management
                - name: vps-backup.timer
                  owner: vps_management
              restricted_tcp_listeners:
                # Unauthenticated reddit-compass entrypoints. Docker writes its
                # DNAT rules straight into the nat/DOCKER chain, bypassing UFW,
                # so a missing `127.0.0.1:` in the app compose exposes the whole
                # collected corpus to the internet without any login. That has
                # already happened once; default scope flags any public bind.
                # The authenticated public HTTPS entrypoint is deliberately not
                # listed here — it is meant to be reachable.
                - port: 8900
                  name: reddit-compass-local-ui
                  owner: reddit_compass
                - port: 8901
                  name: reddit-compass-api-direct
                  owner: reddit_compass
        vps_bootstrap:
          hosts: {}
